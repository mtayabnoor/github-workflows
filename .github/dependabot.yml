version: 2
updates:
  # Terraform providers (.terraform.lock.hcl) and module versions (?ref=vX.Y.Z)
  - package-ecosystem: "terraform"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "terraform"