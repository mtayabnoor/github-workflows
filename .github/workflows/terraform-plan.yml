name: Terraform Plan
# Called from each environment repo. Runs in the context of the CALLING repo:
# its code, its secrets, its pull request and its GITHUB_TOKEN.
on:
  workflow_call:
    inputs:
      environment:
        description: "Environment name, e.g. dev, staging, prod. Used in names, comments and concurrency."
        type: string
        required: true
      aws_region:
        type: string
        default: "eu-central-1"
      tf_version:
        description: "Must match the version used by the apply workflow"
        type: string
        default: "1.10.5"   # >= 1.10 required for S3 native locking (use_lockfile)
      working_directory:
        description: "Folder with the Terraform root module, relative to the repo root"
        type: string
        default: "."
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      TF_PLAN_PASSPHRASE:
        required: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    name: Plan (${{ inputs.environment }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    concurrency:
      group: terraform-plan-${{ inputs.environment }}-${{ github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}

    steps:
      # Plan the PR head commit, the same commit the apply workflow checks out
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ inputs.tf_version }}
          terraform_wrapper: false

      - name: Cache provider plugins
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ runner.os }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', inputs.working_directory)) }}

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check -recursive -diff

      - name: Terraform init
        id: init
        run: |
          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform init -no-color

      - name: Terraform validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -lock-timeout=5m -detailed-exitcode -out=tfplan
          exit_code=$?
          set -e

          echo "exitcode=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -eq 1 ]; then
            echo "::error::Terraform plan failed"
            exit 1
          fi

          terraform show -no-color tfplan > plan.txt

      # The binary plan holds every value in plain text, including ones marked sensitive.
      # Encrypt it so the artifact is useless to anyone who can download it.
      - name: Encrypt plan
        if: steps.plan.outcome == 'success'
        env:
          TF_PLAN_PASSPHRASE: ${{ secrets.TF_PLAN_PASSPHRASE }}
          PLAN_EXITCODE: ${{ steps.plan.outputs.exitcode }}
        run: |
          if [ -z "$TF_PLAN_PASSPHRASE" ]; then
            echo "::error::Secret TF_PLAN_PASSPHRASE is not set"
            exit 1
          fi
          gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --output tfplan.gpg tfplan <<< "$TF_PLAN_PASSPHRASE"
          rm -f tfplan
          echo "$PLAN_EXITCODE" > exitcode.txt

      - name: Write job summary
        if: always() && steps.plan.outputs.exitcode != '1' && steps.plan.outcome != 'skipped'
        run: |
          {
            echo "## Terraform Plan (${{ inputs.environment }})"
            if [ "${{ steps.plan.outputs.exitcode }}" = "2" ]; then
              echo "**Changes detected.**"
            else
              echo "**No changes.** Infrastructure matches the configuration."
            fi
            echo '<details><summary>Show plan</summary>'
            echo
            echo '```hcl'
            head -c 60000 plan.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      # Uploaded for every successful plan, with or without changes, so the apply
      # workflow can tell "no changes" apart from "plan missing or expired".
      - name: Upload plan artifact
        if: steps.plan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tfplan-${{ inputs.environment }}-${{ github.event.pull_request.number || github.run_id }}
          path: |
            ${{ inputs.working_directory }}/tfplan.gpg
            ${{ inputs.working_directory }}/exitcode.txt
          retention-days: 14
          if-no-files-found: error

      - name: Comment plan on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          WORKDIR: ${{ inputs.working_directory }}
          FMT_OUTCOME: ${{ steps.fmt.outcome }}
          INIT_OUTCOME: ${{ steps.init.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          PLAN_EXITCODE: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const env = process.env.ENVIRONMENT;
            const marker = `<!-- terraform-plan-${env} -->`;
            const icon = (o) => (o === 'success' ? '✅' : o === 'skipped' ? '⏭️' : '❌');

            const planFile = path.join(process.env.WORKDIR, 'plan.txt');
            let plan = fs.existsSync(planFile) ? fs.readFileSync(planFile, 'utf8') : 'Plan not available.';
            const limit = 60000;
            if (plan.length > limit) {
              plan = plan.substring(0, limit) + '\n\n... plan truncated, see the workflow run for full output.';
            }

            const summary = process.env.PLAN_EXITCODE === '2'
              ? '**Changes detected.**'
              : process.env.PLAN_EXITCODE === '0' ? '**No changes.**' : '';

            const body = `${marker}
            ### Terraform Plan — \`${env}\`

            | Step | Result |
            |------|--------|
            | Format | ${icon(process.env.FMT_OUTCOME)} |
            | Init | ${icon(process.env.INIT_OUTCOME)} |
            | Validate | ${icon(process.env.VALIDATE_OUTCOME)} |
            | Plan | ${icon(process.env.PLAN_OUTCOME)} |

            ${summary}

            <details><summary>Show plan</summary>

            \`\`\`hcl
            ${plan}
            \`\`\`

            </details>

            *Triggered by ${context.actor} · [Workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*`;

            // Paginate so the existing comment is found even on PRs with 100+ comments
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
